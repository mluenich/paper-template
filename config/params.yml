# Project configuration (YAML)
# Keep this file under version control.

paths:
  raw_data_dir: "data/raw"
  derived_data_dir: "data/derived"
  output_dir: "output"
  figures_dir: "output/figures"
  tables_dir: "output/tables"
  checkpoints_dir: "output/checkpoints"

analysis:
  seed: 123
  fast_mode: false
  scipen: 5
  miss_codes: [-98, -99]
  ref_industry_target: "Information technology and data processing"

render:
  enable: true
  input: "manuscript/paper.Rmd"
  output_dir: "output"
  date_prefix: true
